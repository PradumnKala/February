<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card" id="card">
      <h1 class="title">Will you be my Valentine? 💖</h1>

      <div class="buttons" id="buttons" aria-live="polite">
        <button id="yesButton" class="btn btn-yes" type="button">Yes 💘</button>
        <button id="noButton" class="btn btn-no" type="button">No 🙈</button>
      </div>

      <p id="status" class="status" aria-live="assertive"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
